name: Build SiteRP.Core

on:
  push:
    branches:
      - siterp-core-build
    paths:
      - 'scpsl/SiteRP.Core/**'
      - '.github/workflows/build-siterp-core.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scpsl/SiteRP.Core/**'
      - '.github/workflows/build-siterp-core.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download SCP SL dedicated server references
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip" -OutFile "$env:RUNNER_TEMP\steamcmd.zip"
          Expand-Archive "$env:RUNNER_TEMP\steamcmd.zip" -DestinationPath "$env:RUNNER_TEMP\steamcmd" -Force

          & "$env:RUNNER_TEMP\steamcmd\steamcmd.exe" +quit
          if ($LASTEXITCODE -ne 0) { Write-Host "SteamCMD updater returned $LASTEXITCODE; continuing with updated client." }

          # Current public Windows depot for SCP:SL Dedicated Server (App 996560 / Depot 996561).
          & "$env:RUNNER_TEMP\steamcmd\steamcmd.exe" +login anonymous +download_depot 996560 996561 64315380234631006 +quit
          if ($LASTEXITCODE -ne 0) { throw "SCP SL depot download failed with exit code $LASTEXITCODE" }

          $managedDir = Get-ChildItem "$env:RUNNER_TEMP\steamcmd" -Directory -Recurse -Filter Managed |
              Where-Object { Test-Path (Join-Path $_.FullName 'Assembly-CSharp.dll') } |
              Select-Object -First 1
          if ($null -eq $managedDir) { throw "Could not find SCPSL_Data/Managed in downloaded depot." }

          "SL_MANAGED=$($managedDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using SCP SL references from $($managedDir.FullName)"

      - name: Verify server references
        shell: pwsh
        run: |
          if (!(Test-Path "$env:SL_MANAGED\LabAPI.dll")) { throw "LabAPI.dll not found in $env:SL_MANAGED" }
          if (!(Test-Path "$env:SL_MANAGED\Assembly-CSharp.dll")) { throw "Assembly-CSharp.dll not found in $env:SL_MANAGED" }

      - name: Build SiteRP.Core
        shell: pwsh
        run: |
          dotnet build "$env:GITHUB_WORKSPACE\scpsl\SiteRP.Core\SiteRP.Core.csproj" -c Release -p:SL_REFERENCES="$env:SL_MANAGED"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SiteRP.Core
          path: scpsl/SiteRP.Core/bin/Release/net48/SiteRP.Core.dll
          if-no-files-found: error
