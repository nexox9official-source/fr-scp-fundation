name: Build SiteRP.Core

on:
  push:
    branches:
      - siterp-core-build
    paths:
      - 'scpsl/SiteRP.Core/**'
      - '.github/workflows/build-siterp-core.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scpsl/SiteRP.Core/**'
      - '.github/workflows/build-siterp-core.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Download SCP SL managed references
        shell: pwsh
        run: |
          $builder = "$env:RUNNER_TEMP\slrefs"
          New-Item -ItemType Directory -Force -Path $builder | Out-Null
          $exe = "$builder\SecretLabDependenciesBuilder.exe"

          Invoke-WebRequest -Uri "https://github.com/Jesus-QC/SecretLabDependenciesBuilder/releases/download/1.3.0.0/SecretLabDependenciesBuilder.exe" -OutFile $exe

          @"
          AssembliesToPublicize:
          - Assembly-CSharp.dll
          - Mirror.dll
          ZipReferences: false
          ReferencesZipName: References.zip
          SaveReferencesToFolder: true
          ReferencesFolderName: References
          "@ | Set-Content -Path "$builder\config.yml" -Encoding utf8

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $exe
          $psi.WorkingDirectory = $builder
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $psi
          [void]$process.Start()
          $process.StandardInput.WriteLine("")
          $process.StandardInput.WriteLine("")
          $process.StandardInput.Close()
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          Write-Host $stdout
          if ($stderr) { Write-Host $stderr }
          if ($process.ExitCode -ne 0) { throw "SecretLabDependenciesBuilder failed with exit code $($process.ExitCode)" }

          $refs = "$builder\References"
          if (!(Test-Path "$refs\Assembly-CSharp.dll")) { throw "Assembly-CSharp.dll missing from downloaded references." }
          if (!(Test-Path "$refs\LabAPI.dll")) { throw "LabAPI.dll missing from downloaded references." }

          "SL_MANAGED=$refs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using SCP SL references from $refs"

      - name: Verify server references
        shell: pwsh
        run: |
          $required = @(
            'LabAPI.dll',
            'Assembly-CSharp.dll',
            'Assembly-CSharp-firstpass.dll',
            'CommandSystem.Core.dll',
            'Mirror.dll',
            'NorthwoodLib.dll',
            'Pooling.dll',
            'UnityEngine.CoreModule.dll'
          )
          foreach ($dll in $required) {
            if (!(Test-Path (Join-Path $env:SL_MANAGED $dll))) { throw "$dll not found in $env:SL_MANAGED" }
          }

      - name: Build SiteRP.Core
        shell: pwsh
        run: |
          dotnet build "$env:GITHUB_WORKSPACE\scpsl\SiteRP.Core\SiteRP.Core.csproj" -c Release -p:SL_REFERENCES="$env:SL_MANAGED"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SiteRP.Core
          path: scpsl/SiteRP.Core/bin/Release/net48/SiteRP.Core.dll
          if-no-files-found: error
